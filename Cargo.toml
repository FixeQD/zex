[workspace]
resolver = "3"
members = [
    "crates/zex-core",
    "crates/zex-services",
    "crates/zex-launcher",
    "crates/zex-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/fixeq/zex"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }