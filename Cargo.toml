[workspace]
resolver = "3"
members = [
    "crates/zex-core",
    "crates/zex-services",
    "crates/zex-launcher",
    "crates/zex-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/fixeq/zex"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tarpc = { version = "0.38", features = ["serde-transport-json", "unix"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zeroize = "1"
libc = "0.2"
rust-embed = "8"

grass = "0.13"

# iced stack
iced = { version = "0.14", features = ["wgpu"] }
iced_exwlshell = { version = "0.19", features = ["debug", "linux-theme-detection"] }
iced_wgpu = "0.14"
iced_core = "0.14"
iced_widget = "0.14"
iced_graphics = "0.14"
iced_runtime = "0.14"
iced_futures = "0.14"
iced_renderer = "0.14"
